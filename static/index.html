<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VeriCampus AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    
    <script>
        // Placeholder to prevent errors if Capacitor isn't loaded yet
        window.Capacitor = window.Capacitor || undefined;
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
    
    <style>
        /* System Fonts */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f9ff;
            /* Critical for iOS Keyboard sticking */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overscroll-behavior: none;
        }
        
       /* Chat BG */
        .chat-bg { 
            background-color: #e5ddd5; 
            background-image: url('/static/bg.jpg');
            background-attachment: fixed;
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* Message Styling */
        .msg-sent { 
            background: #1e3a8a; color: white; 
            border-radius: 18px 18px 4px 18px; 
            max-width: 85%; align-self: flex-end; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
        }
        .msg-received { 
            background: #ffffff; color: #1f2937; 
            border-radius: 18px 18px 18px 4px; 
            max-width: 85%; align-self: flex-start; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; 
        }
        
        /* Loader */
        @keyframes spin-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .gemini-loader { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; position: relative; }
        .gemini-ring { position: absolute; width: 100%; height: 100%; border: 3px solid transparent; border-top-color: #1e3a8a; border-right-color: #60a5fa; border-radius: 50%; animation: spin-ring 1s linear infinite; }
        .gemini-logo { width: 24px; height: 24px; object-fit: contain; z-index: 10; }

        /* Actions & Utils */
        .msg-actions { opacity: 0; transition: opacity 0.2s; display: flex; gap: 6px; margin-top: 4px; }
        .msg-wrapper:hover .msg-actions, .msg-wrapper.active .msg-actions { opacity: 1; }
        .action-btn { padding: 5px 8px; background: #f3f4f6; border-radius: 6px; color: #6b7280; cursor: pointer; font-size: 12px; }
        .action-btn:hover { background: #e5e7eb; color: #1e3a8a; }
        .active-school { background-color: #eff6ff; border-left: 4px solid #1e3a8a; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }

        /* Mic Animation */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); transform: scale(1.1); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); transform: scale(1); }
        }
        .mic-active { color: #dc2626 !important; animation: pulse-red 1.5s infinite; }
    </style>
</head>

<body id="main-viewport">

    <button id="install-btn" onclick="installApp()" class="hidden fixed top-4 right-4 z-[60] bg-black text-white px-4 py-2 rounded-full shadow-xl font-bold text-xs flex items-center gap-2 border border-gray-700">
        <i class="fas fa-download"></i> Install App
    </button>

    <div id="sidebar-overlay" onclick="closeSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <div id="app-container" class="w-full h-full flex flex-row overflow-hidden relative">

        <div id="sidebar" class="absolute inset-y-0 left-0 w-[280px] bg-white border-r border-gray-200 flex flex-col z-50 transform -translate-x-full md:relative md:translate-x-0 sidebar-transition shadow-2xl md:shadow-none h-full">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex-none">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <img src="/static/logo.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg object-contain">
                        <h2 class="font-bold text-lg text-gray-800">VeriCampus <span class="text-blue-800">AI</span></h2>
                    </div>
                    <button onclick="closeSidebar()" class="md:hidden text-gray-500 p-2"><i class="fas fa-times"></i></button>
                </div>
                <input type="text" id="search-school" oninput="filterSchools()" placeholder="Search chats..." class="w-full bg-white border border-gray-200 text-gray-700 text-sm rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>
            
            <div id="school-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            
            <div class="p-4 border-t border-gray-100 space-y-2 flex-none bg-white">
                <button onclick="showLoginModal()" class="w-full bg-blue-50 text-blue-700 py-3 rounded-xl font-semibold hover:bg-blue-100 transition flex items-center justify-center gap-2 border border-blue-200">
                    <i class="fas fa-plus"></i> Add School
                </button>
                <a href="/admin" target="_blank" class="w-full bg-gray-900 text-white py-3 rounded-xl font-semibold hover:bg-gray-800 transition flex items-center justify-center gap-2 text-sm shadow-lg">
                    <i class="fas fa-user-shield"></i> Admin Panel
                </a>
            </div>
        </div>

        <div class="flex-1 flex flex-col h-full relative min-w-0 bg-white">
            <div class="bg-white/95 backdrop-blur-sm px-4 py-3 shadow-sm flex-none flex items-center justify-between border-b border-gray-100 z-20">
                <div class="flex items-center gap-3 overflow-hidden">
                    <button onclick="openSidebar()" class="md:hidden text-gray-600 p-1 -ml-2"><i class="fas fa-bars text-xl"></i></button>
                    <div class="flex items-center gap-2">
                        <img src="/static/logo.png" onerror="this.style.display='none'" class="w-8 h-8 object-contain">
                        <div class="flex flex-col overflow-hidden">
                            <h1 class="font-bold text-gray-800 leading-tight truncate text-base" id="header-display-name">Select School</h1>
                            <p class="text-[10px] text-gray-400 truncate" id="header-real-id">Not Connected</p>
                        </div>
                    </div>
                </div>
                <div class="flex gap-4 text-gray-400">
                     <button onclick="refreshApp()" title="Refresh App" class="hover:text-blue-600 transition"><i class="fas fa-sync-alt"></i></button>
                     <button onclick="clearChat()" title="Clear History" class="hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>

            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col chat-bg pb-4 scrolling-touch">
                <div class="flex flex-col items-center justify-center mt-20 opacity-60 gap-4">
                    <img src="/static/logo.png" onerror="this.style.display='none'" class="w-24 h-24 object-contain opacity-50 grayscale">
                    <p class="text-sm text-gray-500 font-medium">Select a school from the menu</p>
                </div>
            </div>

            <div class="bg-white p-3 border-t border-gray-200 flex-none z-30 w-full" id="input-bar">
                <div class="flex gap-2 max-w-4xl mx-auto items-end">
                    <div class="flex-1 bg-gray-100 rounded-2xl flex items-center px-4 border border-transparent focus-within:border-blue-300 focus-within:bg-white transition">
                        <input type="text" id="user-input" 
                               class="flex-1 bg-transparent border-0 text-sm focus:outline-none text-gray-800 placeholder-gray-500 py-3 max-h-32" 
                               placeholder="Ask a question..." 
                               disabled
                               autocomplete="off"
                               enterkeyhint="send"
                               onkeypress="handleEnter(event)">
                        
                        <button id="mic-btn" onclick="toggleVoice()" class="text-gray-400 hover:text-red-500 transition px-2 py-3 outline-none">
                            <i class="fas fa-microphone text-lg"></i>
                        </button>
                    </div>
                    
                    <button onclick="sendMessage()" id="send-btn" class="bg-blue-900 text-white w-11 h-11 rounded-full flex-none flex items-center justify-center shadow-lg hover:bg-blue-800 transition transform active:scale-95 disabled:opacity-50" disabled>
                        <i class="fas fa-paper-plane text-sm pl-0.5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6">
            <div class="flex justify-center mb-4"><img src="/static/logo.png" onerror="this.style.display='none'" class="w-16 h-16 object-contain"></div>
            <h2 class="text-xl font-bold text-gray-800 text-center mb-4">School Login</h2>
            <input type="text" id="new-school-id" placeholder="Enter ID (e.g. FUTO-2845)" class="w-full px-4 py-3 bg-gray-50 border rounded-xl text-center font-bold text-lg uppercase mb-4 focus:ring-2 focus:ring-blue-900 outline-none">
            <div class="flex gap-2">
                <button onclick="closeLoginModal()" class="flex-1 py-3 rounded-xl text-gray-500 hover:bg-gray-100">Cancel</button>
                <button onclick="addNewSchool()" class="flex-1 bg-blue-900 text-white font-bold py-3 rounded-xl">Connect</button>
            </div>
        </div>
    </div>

    <div id="options-menu" class="fixed inset-0 z-50 hidden" onclick="hideOptions()">
        <div class="absolute bottom-0 left-0 right-0 md:bottom-auto md:left-auto md:right-auto md:w-48 bg-white rounded-t-2xl md:rounded-xl shadow-2xl border border-gray-100 overflow-hidden" id="options-content">
            <div class="p-1">
                <button onclick="menuAction('rename')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 text-gray-700 rounded-lg"><i class="fas fa-pen w-4"></i> Rename</button>
                <button onclick="menuAction('pin')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 text-gray-700 rounded-lg"><i class="fas fa-thumbtack w-4"></i> Pin</button>
                <button onclick="menuAction('share')" class="w-full text-left px-4 py-3 hover:bg-gray-50 flex items-center gap-3 text-gray-700 rounded-lg"><i class="fas fa-share-alt w-4"></i> Share ID</button>
                <button onclick="menuAction('delete')" class="w-full text-left px-4 py-3 hover:bg-red-50 flex items-center gap-3 text-red-600 rounded-lg"><i class="fas fa-trash w-4"></i> Delete</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. iOS KEYBOARD RESIZE LOGIC ---
        function handleViewportResize() {
            if (window.visualViewport) {
                const appContainer = document.getElementById('app-container');
                appContainer.style.height = `${window.visualViewport.height}px`;
                window.scrollTo(0, 0);
            }
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleViewportResize);
            window.visualViewport.addEventListener('scroll', handleViewportResize);
        }

        // --- STATE & VARS ---
        let schools = JSON.parse(localStorage.getItem('vericampus_schools_v2')) || [];
        let pinned = JSON.parse(localStorage.getItem('vericampus_pinned')) || [];
        let chatHistory = JSON.parse(localStorage.getItem('vericampus_history_v2')) || {};
        let currentSchoolObj = null;
        let menuTargetIndex = null;
        let synth = window.speechSynthesis;
        let speakingMsgId = null; 
        let isListening = false;

        // --- VOICE RECOGNITION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; recognition.lang = 'en-NG'; recognition.interimResults = true;
            recognition.onstart = function() { isListening = true; updateMicUI(true); };
            recognition.onend = function() { stopMicLogic(); }; 
            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) transcript += event.results[i][0].transcript;
                document.getElementById('user-input').value = transcript;
            };
        }

        async function toggleVoice() {
            if (isListening) { stopMicLogic(); if(window.Capacitor) { try{ await Capacitor.Plugins.SpeechRecognition.stop(); }catch(e){} } else if(recognition) { recognition.stop(); } return; }
            const input = document.getElementById('user-input'); input.value = ""; 
            
            if (window.Capacitor) {
                try {
                    const CapSpeech = Capacitor.Plugins.SpeechRecognition;
                    const perm = await CapSpeech.checkPermissions();
                    if (perm.speechRecognition !== 'granted') await CapSpeech.requestPermissions();
                    isListening = true; updateMicUI(true);
                    CapSpeech.addListener('partialResults', (data) => { if (data.matches && data.matches.length > 0) input.value = data.matches[0]; });
                    await CapSpeech.start({ language: "en-NG", maxResults: 1, prompt: "Speak now...", partialResults: true, popup: false });
                } catch (e) { stopMicLogic(); alert("Mic Error: " + JSON.stringify(e)); }
            } else {
                if (!recognition) { alert("Mic not supported"); return; }
                try { recognition.start(); } catch(e) { recognition.stop(); setTimeout(()=>recognition.start(), 200); }
            }
        }

        function stopMicLogic() { isListening = false; updateMicUI(false); }
        function updateMicUI(active) {
            const micBtn = document.getElementById('mic-btn'); const input = document.getElementById('user-input');
            if (active) { micBtn.classList.remove('text-gray-400'); micBtn.classList.add('mic-active'); input.placeholder = "Listening..."; }
            else { micBtn.classList.remove('mic-active'); micBtn.classList.add('text-gray-400'); input.placeholder = "Ask a question..."; }
        }

        // --- INSTALL LOGIC ---
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden'); });
        async function installApp() { if (!deferredPrompt) return; deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') installBtn.classList.add('hidden'); deferredPrompt = null; }

        renderSidebar();
        // Load initial school but DON'T auto-trigger notifications yet (Wait for user action or explicit click)
        if(schools.length > 0) selectSchool(schools[0], false); else showLoginModal();

        // --- CORE FUNCTIONS ---
        function openSidebar() { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebar-overlay').classList.remove('hidden'); }
        function closeSidebar() { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebar-overlay').classList.add('hidden'); }
        function showLoginModal() { document.getElementById('login-modal').style.display = 'flex'; document.getElementById('new-school-id').focus(); }
        function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }
        function refreshApp() { window.location.reload(); }

        function addNewSchool() {
            const input = document.getElementById('new-school-id'); const rawId = input.value.trim().toUpperCase(); if(!rawId) return;
            const exists = schools.find(s => s.id === rawId);
            if (!exists) { const newSchool = { id: rawId, name: rawId }; schools.unshift(newSchool); saveData(); selectSchool(newSchool, true); } 
            else { selectSchool(exists, true); }
            closeLoginModal(); renderSidebar(); input.value = "";
        }

        function renderSidebar(filter = "") {
            const list = document.getElementById('school-list'); list.innerHTML = "";
            const sortedSchools = [...schools].sort((a, b) => { const aPin = pinned.includes(a.id); const bPin = pinned.includes(b.id); return (aPin === bPin) ? 0 : aPin ? -1 : 1; });
            sortedSchools.forEach((school, index) => {
                if(!school.name.toLowerCase().includes(filter)) return;
                const isActive = currentSchoolObj && school.id === currentSchoolObj.id ? 'active-school bg-blue-50' : 'hover:bg-gray-50';
                const isPinned = pinned.includes(school.id);
                const item = document.createElement('div');
                item.className = `p-3 cursor-pointer transition flex items-center gap-3 border-b border-gray-100 ${isActive}`;
                item.onclick = () => selectSchool(school, true); // True = Trigger Notifications logic
                item.innerHTML = `<div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold shadow-sm bg-blue-100 text-blue-800 flex-none relative">${school.name.substring(0, 2).toUpperCase()}${isPinned ? '<div class="absolute -top-1 -right-1 bg-white rounded-full p-0.5 shadow-sm"><i class="fas fa-thumbtack text-[8px] text-blue-600"></i></div>' : ''}</div><div class="flex-1 min-w-0"><p class="font-bold text-sm text-gray-800 truncate">${school.name}</p><p class="text-[10px] text-gray-500 truncate uppercase tracking-wide">ID: ${school.id}</p></div><button onclick="showOptions(event, ${index})" class="w-8 h-8 flex-none flex items-center justify-center rounded-full hover:bg-gray-200 text-gray-400"><i class="fas fa-ellipsis-v text-xs"></i></button>`;
                list.appendChild(item);
            });
        }

        async function selectSchool(school, triggerNotifs = false) {
            currentSchoolObj = school;
            document.getElementById('header-display-name').innerText = school.name;
            document.getElementById('header-real-id').innerText = "Connected: " + school.id;
            document.getElementById('user-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            if(window.innerWidth < 768) closeSidebar();
            renderSidebar();
            loadChatHistory();
            
            // --- FIXED NOTIFICATION LOGIC ---
            if (triggerNotifs) {
                requestNotifications(school.id);
            }
        }
        
        async function requestNotifications(topicId) {
            // 1. NATIVE APK (Restored Logic!)
            if (window.Capacitor) {
                try {
                    const PushNotifications = Capacitor.Plugins.PushNotifications;
                    const FCM = Capacitor.Plugins.FCM; // Make sure this plugin is installed!
                    
                    let permStatus = await PushNotifications.checkPermissions();
                    if (permStatus.receive === 'prompt') permStatus = await PushNotifications.requestPermissions();
                    
                    if (permStatus.receive === 'granted') {
                        await PushNotifications.register();
                        // If you use @capacitor-community/fcm
                        if(FCM) {
                            await FCM.subscribeTo({ topic: topicId.toUpperCase() });
                            // alert("App Subscribed to " + topicId); // Debug line
                        } else {
                            // Fallback if FCM plugin missing (APK needs this plugin for topics)
                            console.warn("FCM Plugin missing for topic subscription");
                        }
                    } else {
                        alert("Please enable notifications in settings to receive updates.");
                    }
                } catch (e) { console.error("Native Push Error:", e); }
            } 
            // 2. WEB / iOS PWA
            else {
                initWebNotifications(topicId);
            }
        }

        async function initWebNotifications(topicId) {
             try {
                const firebaseConfig = { apiKey: "AIzaSyADy57398AgmjhkaTUvTQpRQ1hdCijGgvs", projectId: "vericampus-13104", appId: "1:762945690586:web:66e6a7fc5a524cb2c93ee3", messagingSenderId: "762945690586" };
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                const messaging = firebase.messaging();
                
                // CRITICAL: Request permission must be inside a user-triggered function (which this is now, via click)
                const permission = await Notification.requestPermission();
                if(permission === 'granted') {
                    const reg = await navigator.serviceWorker.register('/static/firebase-messaging-sw.js');
                    const token = await messaging.getToken({ vapidKey: "BJlKbEwKwIv-JksOVjgKRimUu6VSC9eaoOSbsGjCJafMUW4bTWvDtR5ssc7Uvx3BWj3A9sYtdaWSqRrX3ovaSIU", serviceWorkerRegistration: reg });
                    if(token) { 
                        const fd = new FormData(); fd.append('token', token); fd.append('topic', topicId.toUpperCase()); 
                        await fetch('/subscribe-web', { method: 'POST', body: fd });
                        // alert("Web Subscribed!"); // Debug line
                    }
                }
             } catch(e) { console.log("Web Note Error", e); }
        }

        // --- HELPER FUNCTIONS ---
        function showOptions(e, index) { e.stopPropagation(); menuTargetIndex = index; document.getElementById('options-menu').classList.remove('hidden'); const content = document.getElementById('options-content'); if(window.innerWidth >= 768) { const rect = e.target.getBoundingClientRect(); content.style.top = `${rect.top + 20}px`; content.style.left = `${rect.left - 150}px`; } }
        function hideOptions() { document.getElementById('options-menu').classList.add('hidden'); }
        function menuAction(action) { const target = schools[menuTargetIndex]; if(action === 'rename') { const newName = prompt("Rename:", target.name); if(newName) target.name = newName.trim(); } else if (action === 'pin') { pinned.includes(target.id) ? pinned = pinned.filter(id=>id!==target.id) : pinned.push(target.id); } else if (action === 'share') { navigator.clipboard.writeText(target.id).then(()=>alert("ID Copied!")); } else if (action === 'delete') { if(confirm(`Delete ${target.name}?`)) { schools.splice(menuTargetIndex, 1); delete chatHistory[target.id]; if(currentSchoolObj?.id === target.id) { currentSchoolObj = null; location.reload(); } } } saveData(); renderSidebar(); hideOptions(); }
        function saveData() { localStorage.setItem('vericampus_schools_v2', JSON.stringify(schools)); localStorage.setItem('vericampus_pinned', JSON.stringify(pinned)); localStorage.setItem('vericampus_history_v2', JSON.stringify(chatHistory)); }
        
        function loadChatHistory() { 
            const chatBox = document.getElementById('chat-box'); 
            const history = chatHistory[currentSchoolObj.id] || []; 
            if(history.length === 0) { 
                chatBox.innerHTML = `<div class="flex flex-col items-center justify-center mt-10 gap-4 animate-fade-in"><img src="/static/logo.png" onerror="this.style.display='none'" class="w-16 h-16 object-contain"><div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 max-w-xs text-center"><p class="text-sm text-gray-800">👋 Hi! I'm connected to the <b>${currentSchoolObj.name}</b> database. Ask me anything!</p></div></div>`; 
            } else { 
                chatBox.innerHTML = history.map((msg, idx) => msg.sender === 'user' ? renderUserMsg(msg.text, msg.time, idx) : renderAIMsg(msg.text, msg.time, idx)).join(''); 
            } 
            setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 0); 
        }

        function renderUserMsg(text, time, idx) { return `<div id="msg-wrapper-${idx}" class="msg-wrapper w-full flex flex-col items-end group" onclick="this.classList.toggle('active')"><div class="msg-sent p-3 px-4"><p class="text-sm leading-relaxed">${text}</p><span class="text-[10px] text-blue-200 block text-right mt-1">${time}</span></div><div class="msg-actions mr-1"><button onclick="editMessage('${text}', ${idx})" class="action-btn" title="Edit"><i class="fas fa-pen"></i></button><button onclick="copyText('${text}')" class="action-btn" title="Copy"><i class="fas fa-copy"></i></button></div></div>`; }
        
        function renderAIMsg(text, time, idx) { 
            const safeText = text.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' '); 
            const btnId = `speak-btn-${idx}`; 
            return `<div id="msg-wrapper-${idx}" class="msg-wrapper w-full flex flex-col items-start group" onclick="this.classList.toggle('active')">
                <div class="msg-received p-3 px-4"><p class="text-sm leading-relaxed">${text}</p><span class="text-[10px] text-gray-400 block text-right mt-1">${time}</span></div>
                <div class="msg-actions ml-1">
                    <button id="${btnId}" onclick="toggleSpeech('${safeText}', '${btnId}')" class="action-btn" title="Read Aloud"><i class="fas fa-volume-up"></i></button>
                    <button onclick="copyText('${safeText}')" class="action-btn" title="Copy"><i class="fas fa-copy"></i></button>
                    <button onclick="regenerate(${idx})" class="action-btn" title="Regenerate"><i class="fas fa-redo"></i></button>
                    <button onclick="feedback(this, 'good')" class="action-btn" title="Good"><i class="fas fa-thumbs-up"></i></button>
                    <button onclick="feedback(this, 'bad')" class="action-btn" title="Bad"><i class="fas fa-thumbs-down"></i></button>
                    <button onclick="shareText('${safeText}')" class="action-btn" title="Share"><i class="fas fa-share-alt"></i></button>
                </div>
            </div>`; 
        }

        function copyText(text) { navigator.clipboard.writeText(text).then(() => alert("Copied!")); }
        
        async function toggleSpeech(text, btnId) { 
            const btn = document.getElementById(btnId); const clean = text.replace(/<br>/g, ' ');
            if (speakingMsgId === btnId) { 
                if(window.Capacitor) { try { await Capacitor.Plugins.TextToSpeech.stop(); } catch(e) { synth.cancel(); } } else { synth.cancel(); }
                speakingMsgId = null; if(btn) { btn.innerHTML = '<i class="fas fa-volume-up"></i>'; btn.classList.remove('active'); } return; 
            } 
            if(speakingMsgId) { const prev = document.getElementById(speakingMsgId); if(prev) { prev.innerHTML = '<i class="fas fa-volume-up"></i>'; prev.classList.remove('active'); } }
            if(btn) { btn.innerHTML = '<i class="fas fa-stop text-red-500"></i>'; btn.classList.add('active'); } speakingMsgId = btnId;
            if (window.Capacitor) {
                 try { const TTS = Capacitor.Plugins.TextToSpeech; await TTS.speak({ text: clean, lang: 'en-GB', rate: 1.0, pitch: 1.0, volume: 1.0, category: 'ambient' }); if(btn) { btn.innerHTML = '<i class="fas fa-volume-up"></i>'; btn.classList.remove('active'); } speakingMsgId = null; } 
                 catch (e) { console.log("Capacitor TTS failed"); webSpeechFallback(clean, btnId); }
            } else { webSpeechFallback(clean, btnId); }
        }

        function webSpeechFallback(text, btnId) {
             synth.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = "en-GB";
             utterance.onend = () => { const btn = document.getElementById(btnId); if(btn) { btn.innerHTML = '<i class="fas fa-volume-up"></i>'; btn.classList.remove('active'); } speakingMsgId = null; }; synth.speak(utterance);
        }

        function feedback(btn, type) { btn.classList.toggle('text-green-500'); btn.classList.toggle('active'); }
        function editMessage(oldText, index) { const input = document.getElementById('user-input'); input.value = oldText; input.focus(); chatHistory[currentSchoolObj.id].splice(index, 2); saveData(); loadChatHistory(); }
        function regenerate(aiIndex) { const userIndex = aiIndex - 1; if(userIndex >= 0) { const userText = chatHistory[currentSchoolObj.id][userIndex].text; chatHistory[currentSchoolObj.id].splice(aiIndex, 1); saveData(); loadChatHistory(); sendMessage(userText, true); } }
        
        async function shareText(text) { 
            const cleanText = text.replace(/<br>/g, '\n');
            if (navigator.share) { try { await navigator.share({ title: 'VeriCampus Answer', text: cleanText }); } catch (err) { copyText(cleanText); } } 
            else if (window.Capacitor) { try { await Capacitor.Plugins.Share.share({ title: 'VeriCampus Answer', text: cleanText, dialogTitle: 'Share' }); } catch(e) { copyText(cleanText); } }
            else { copyText(cleanText); } 
        }
        
        function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }
        
        async function sendMessage(overrideText = null, skipUserAdd = false) { 
            const input = document.getElementById('user-input'); const message = overrideText || input.value.trim(); if (!message) return; 
            const chatBox = document.getElementById('chat-box'); if (!skipUserAdd) { saveMessage('user', message); loadChatHistory(); } 
            input.value = ''; setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50); 
            const loadingId = "loading-" + Date.now(); 
            chatBox.innerHTML += `<div id="${loadingId}" class="flex items-center gap-3 p-4 bg-white rounded-xl border border-gray-100 shadow-sm w-fit"><div class="gemini-loader"><div class="gemini-ring"></div><img src="/static/logo.png" onerror="this.style.display='none'" class="gemini-logo"></div><span class="text-sm text-blue-600 font-semibold animate-pulse">Just a sec...</span></div>`; 
            chatBox.scrollTop = chatBox.scrollHeight; 
            try { 
                const formData = new FormData(); formData.append('question', message); formData.append('school_id', currentSchoolObj.id); 
                const response = await fetch(`/chat`, { method: 'POST', body: formData }); const data = await response.json(); 
                document.getElementById(loadingId).remove(); const formatted = data.answer.replace(/\n/g, '<br>'); saveMessage('ai', formatted); loadChatHistory(); 
            } catch (err) { document.getElementById(loadingId).remove(); alert("Network Error"); } 
        }
        
        function saveMessage(sender, text) { if(!chatHistory[currentSchoolObj.id]) chatHistory[currentSchoolObj.id] = []; chatHistory[currentSchoolObj.id].push({ sender: sender, text: text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }); saveData(); }
        function clearChat() { if(confirm("Clear chat history?")) { delete chatHistory[currentSchoolObj.id]; saveData(); loadChatHistory(); } }
        function filterSchools() { const query = document.getElementById('search-school').value.toLowerCase(); renderSidebar(query); }
    </script>
</body>
</html>
